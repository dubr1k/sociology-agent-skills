name: Проверка навыков
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - name: Проверка опубликованной сборки
        run: uv run --no-project --python 3.12 python scripts/build.py --check
      - name: Тесты установки
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -v
      - name: Воспроизводимость сборки
        run: |
          uv run --no-project --python 3.12 python scripts/build.py
          git diff --exit-code -- dist/
